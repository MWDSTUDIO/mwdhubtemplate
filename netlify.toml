[build]
  command = "npm run build"
  # No publish dir: the Next runtime v5 plugin manages output itself
  # (.netlify/static + server handler). Setting .next here would make
  # CLI --no-build deploys upload the wrong directory.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# House functions (the heartbeat) live beside the Next runtime's own.
[functions]
  directory = "netlify/functions"

# The technical address bows out: anyone holding an old netlify.app
# link is walked to the house's own door.
[[redirects]]
  from = "https://the-inner-house-mwd.netlify.app/*"
  to = "https://innerhouse.madamewedding.design/:splat"
  status = 301
  force = true

# Vendor outreach leaves from Estelle's inbox through Netlify Forms.
# The static form definition lives in public/netlify-forms.html so the
# build bot registers it; submissions post to /vendor-outreach.
