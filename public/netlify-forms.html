<!doctype html>
<!-- Static registration of the vendor-outreach form so Netlify's build bot
     detects it. Submissions are posted programmatically from the Vendors
     module and leave from Estelle's inbox. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>MWD forms registration</title></head>
  <body>
    <form name="vendor-outreach" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="bot-field" />
      <input type="text" name="wedding" />
      <input type="text" name="vendor" />
      <input type="text" name="category" />
      <input type="text" name="template" />
      <input type="email" name="to" />
      <input type="email" name="reply_to" />
      <input type="text" name="subject" />
      <textarea name="body"></textarea>
    </form>
  </body>
</html>
